<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Unofficial reference to API calls used by Game Jolt's website." />
  <title>Game Jolt API Docs</title>
</head>
<body>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
  <script>
    Scalar.createApiReference("#app", {
      sources: [
        {
          title: "Game Jolt API",
          slug: "rest-api",
          url: "./spec/openapi.yaml",
          default: true
        }
      ],
      layout: "modern",
      theme: "default",
      darkMode: false,
      hideDarkModeToggle: false,
      hideDownloadButton: false,
      hideModels: false,
      hideSearch: false,
      hideTestRequestButton: false,
      showOperationId: false,
      showSidebar: true,
      defaultOpenAllTags: false,
      expandAllModelSections: false,
      expandAllResponses: false,
      orderRequiredPropertiesFirst: true,
      documentDownloadType: "yaml",
      operationTitleSource: "summary",
      persistAuth: false,
      searchHotKey: "k",
      metaData: {
        title: "Game Jolt API Docs",
        description: "Unofficial reference to API calls used by Game Jolt's website.",
        ogTitle: "Game Jolt API Docs",
        ogDescription: "Unofficial reference to API calls used by Game Jolt's website."
      }
    });
  </script>
</body>
</html>
