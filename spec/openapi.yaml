paths:
  /web/discover/games:
    get:
      security: []
      operationId: discoverGames
      summary: List games by section and filters
      description: Returns a paginated game listing. The FNF tag page requests this operation with `tag=fnf`.
      parameters:
        - name: section
          in: query
          required: false
          description: Listing section. The frontend defaults to `featured`; its navigation also uses `hot`, `best`, and `new`.
          schema:
            type: string
            default: featured
        - name: tag
          in: query
          required: false
          description: Game tag slug. The audited page uses `fnf`.
          schema:
            type: string
        - name: date
          in: query
          required: false
          description: Date filter forwarded by the frontend date route. Accepted values were not verified.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: Sort value forwarded from the frontend query string. Accepted values were not verified.
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: One-based page number. The frontend omits this parameter for page 1.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: f_price
          in: query
          required: false
          description: Price filter selected by the listing filters.
          schema:
            type: string
            enum: [free, sale, paid, 5-less, 15-less, 30-less]
        - name: f_os[]
          in: query
          required: false
          description: Repeatable operating-system filter.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [windows, mac, linux, other, rom]
        - name: f_browser[]
          in: query
          required: false
          description: Repeatable browser-runtime filter.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [html, flash, unity]
        - name: f_maturity[]
          in: query
          required: false
          description: Repeatable maturity filter.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [everyone, teen, adult]
        - name: f_status[]
          in: query
          required: false
          description: Repeatable development-status filter.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [complete, wip, devlog]
        - name: f_partners[]
          in: query
          required: false
          description: Repeatable partner-games filter; the frontend currently exposes `partners`.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [partners]
        - name: query
          in: query
          required: false
          description: Text filter. The frontend omits it when blank.
          schema:
            type: string
      responses:
        '200':
          description: Listing response. Verified live for anonymous pages 1 and 2, and one signed-in request for the FNF tag. The signed-in response included a user object and relationship fields on game items.
          headers:
            Content-Type:
              schema:
                type: string
                const: application/json
            Cache-Control:
              description: Observed as `no-cache` on the page 2 request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverGamesResponse'
