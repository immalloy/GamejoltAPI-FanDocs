components:
  schemas:
    DiscoverGamesResponse:
      type: object
      properties:
        ver:
          type: string
        user:
          description: Null in anonymous responses; object in the signed-in sample.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/UserContext'
        c:
          type: object
          properties:
            eea:
              type: boolean
            ads:
              type: boolean
          additionalProperties: true
        t:
          type: array
          items: {}
        payload:
          type: object
          properties:
            games:
              type: array
              items:
                $ref: '#/components/schemas/GameListingItem'
            gamesCount:
              type: integer
            perPage:
              type: integer
          additionalProperties: true
      additionalProperties: true
    UserContext:
      type: object
      description: Fields observed in the signed-in listing response. Field presence in other account states is unknown.
      properties:
        id: { type: integer }
        type: { type: string }
        username: { type: string }
        name: { type: string }
        display_name: { type: string }
        web_site: { type: string }
        url: { type: string }
        slug: { type: string }
        img_avatar: { type: string }
        shouts_enabled: { type: boolean }
        friend_requests_enabled: { type: boolean }
        is_spawnday: { type: boolean }
        status: { type: integer }
        permission_level: { type: integer }
        created_on: { type: integer }
        theme:
          description: Null in the signed-in sample; non-null variants are unverified.
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: true
        follower_count: { type: integer }
        following_count: { type: integer }
        avatar_frame:
          description: Null in the signed-in sample; non-null variants are unverified.
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: true
        is_following: { type: boolean }
        follows_you: { type: boolean }
        is_blocked: { type: boolean }
        blocked_you: { type: boolean }
        can_join_communities: { type: boolean }
        can_create_communities: { type: boolean }
        level: { type: number }
        experience: { type: number }
        experience_next: { type: number }
        level_next_percentage: { type: number }
      additionalProperties: true
    GameListingItem:
      type: object
      description: The listed top-level fields appeared on all 45 anonymous FNF listing items sampled. Nested objects may include other fields; not all variants were sampled.
      properties:
        id:
          type: integer
        developer:
          $ref: '#/components/schemas/DeveloperSummary'
        title:
          type: string
        slug:
          type: string
        path:
          type: string
        img_thumbnail:
          type: string
        header_media_item:
          oneOf:
            - $ref: '#/components/schemas/MediaItem'
            - type: 'null'
        thumbnail_media_item:
          $ref: '#/components/schemas/MediaItem'
        media_count:
          type: integer
        follower_count:
          type: integer
        ratings_enabled:
          type: boolean
        referrals_enabled:
          type: boolean
        compatibility:
          type: object
          description: OS capability keys vary across sampled items.
          properties:
            id:
              type: integer
            game_id:
              type: integer
            os_windows:
              type: boolean
            os_windows_64:
              type: boolean
            os_mac:
              type: boolean
            os_mac_64:
              type: boolean
            os_linux:
              type: boolean
            os_linux_64:
              type: boolean
            os_other:
              type: boolean
          additionalProperties: true
        modified_on:
          type: integer
        posted_on:
          type: integer
        published_on:
          type: integer
        status:
          type: integer
        development_status:
          type: integer
        canceled:
          type: boolean
        tigrs_age:
          type: integer
        has_adult_content:
          type: boolean
        theme:
          type: object
          description: Preset and custom theme variants were observed.
          additionalProperties: true
        should_show_ads:
          type: boolean
        sellable:
          type: object
          description: Includes nested resource data; some nested fields were not inspected.
          additionalProperties: true
        comments_enabled:
          type: boolean
        is_following:
          type: boolean
          description: Present in the signed-in response; absent from the anonymous samples.
        perms:
          type: 'null'
          description: Null on all 36 game items in the signed-in sample; other values are unknown.
      additionalProperties: true
    DeveloperSummary:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        username:
          type: string
        name:
          type: string
        display_name:
          type: string
        web_site:
          type: string
        url:
          type: string
        slug:
          type: string
        img_avatar:
          type: string
        shouts_enabled:
          type: boolean
        friend_requests_enabled:
          type: boolean
        is_spawnday:
          type: boolean
        status:
          type: integer
        permission_level:
          type: integer
        created_on:
          type: integer
        theme:
          type: object
          additionalProperties: true
        follower_count:
          type: integer
        following_count:
          type: integer
        avatar_frame:
          type: [object, 'null']
          additionalProperties: true
      additionalProperties: true
    MediaItem:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        parent_id:
          type: integer
        hash:
          type: string
        filename:
          type: string
        filetype:
          type: string
        is_animated:
          type: boolean
        width:
          type: integer
        height:
          type: integer
        filesize:
          type: integer
        crop_start_x:
          type: [number, 'null']
        crop_start_y:
          type: [number, 'null']
        crop_end_x:
          type: [number, 'null']
        crop_end_y:
          type: [number, 'null']
        avg_img_color:
          type: string
        img_has_transparency:
          type: boolean
        added_on:
          type: integer
        status:
          type: string
        img_url:
          type: string
        mediaserver_url:
          type: string
        mediaserver_url_webm:
          type: [string, 'null']
        mediaserver_url_mp4:
          type: [string, 'null']
        video_card_url_mp4:
          type: [string, 'null']
      additionalProperties: true
